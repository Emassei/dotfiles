onboarding = false
# herdr keybindings — vim-style direct navigation.
# dwm owns Super (Mod4), so plain Alt chords are free for herdr.
# Prefix stays ctrl+b; pane focus is already prefix+h/j/k/l.

[theme]
name = "dracula"

# Unfocused tab titles render overlay0/overlay1 on surface0 (see herdr
# src/client/shell/tabs.rs). Dracula ships overlay0 #6272a4 on #44475a —
# ~2:1 contrast, unreadable. Lift the overlays well clear of the tab bg.
[theme.custom]
overlay0 = "#aeb6d8"
overlay1 = "#ced3ea"

[keys]
# Bounce between workspaces like vim lines: no prefix needed.
next_workspace = "alt+j"
previous_workspace = "alt+k"

# Tabs within a workspace: left/right.
previous_tab = "alt+h"
next_tab = "alt+l"

# Cycle through agents (the fleet, in order).
next_agent = "alt+a"
previous_agent = "alt+shift+a"

# The built-in open_notification_target only focuses a toast that is
# currently ON SCREEN (herdr's reference: "focus the currently visible
# notification target") — no queue, and toasts are suppressed for the active
# tab, so it can't reach a check-marked agent in the sidebar. Left unbound;
# alt+o is the herdr-attend popup below (blocked → done → idle). 2026-09-28.
open_notification_target = ""
# Sidebar agent panel is priority-sorted (blocked, then done/check-marked, at
# the top), so ctrl+b then alt+1 jumps to the top of the attention queue,
# alt+2 the next, etc. Deterministic fallback when the toast queue is empty.
focus_agent = "prefix+alt+1..9"

# dwm-tag style: alt+1..9 jumps straight to that workspace.
switch_workspace = "alt+1..9"

# New tab, no prefix. (ctrl+n would shadow vim completion / zsh history.)
new_tab = "alt+n"
rename_tab = "alt+r"

# Quick side-by-side split (spin up a second agent next to the first).
split_vertical = "alt+v"

# Keyboard scrollback: enter copy/scroll mode (vim-style movement inside).
# alt+u = "up", like vim's ctrl+u half-page.
copy_mode = "alt+u"

# Fullscreen the tab: toggle the sidebar away (zoom only maximizes a
# pane within the tab, and most tabs here are single-pane). Safe because
# zsh runs vi-mode, so alt+f isn't forward-word here.
toggle_sidebar = "alt+f"

[terminal]
# Herdr's pane emulator advertises kitty graphics (incl. shared-memory
# transport) to pane programs, but only draws them when the OUTER terminal
# is kitty/ghostty/wezterm. Under alacritty that means yazi picks the kitty
# path, nothing renders, and its image task hangs. Off = yazi falls back to
# the ueberzugpp X11 overlay, which works. Re-enable if the terminal changes.
# Takes effect on server restart or client reattach.
kitty_graphics = false

[ui]
# When the sidebar is toggled off, take it to zero width instead of
# leaving the thin status rail.
sidebar_collapsed_mode = "hidden"

# Show which agent runs where: pane borders get the detected agent name,
# and each sidebar agent row is one line: dot, agent kind, workspace.
show_agent_labels_on_pane_borders = true

# Attention queue: blocked agents float to the top of the agent panel.
agent_panel_sort = "priority"

# No desktop popups — the sidebar queue and alt+o are the interface.
status_indicators = "symbols"
[ui.toast]
# "herdr" = small in-app toasts inside the herdr window (not desktop popups).
# Needed because the alt+o built-in (open_notification_target) walks the
# toast queue: with delivery = "off" there is no queue and alt+o is inert.
delivery = "herdr"

# Audible ping when an agent finishes or needs input.
[ui.sound]
enabled = true

[ui.sidebar.agents]
# Explicit bright styling — the agent token renders too dim under dracula.
# cyan = agent kind, foreground-white = workspace name.
rows = [[
  { token = "state_icon" },
  { token = "agent", fg = "#8be9fd", bold = true, dim = false },
  { token = "workspace", fg = "#f8f8f2", dim = false },
]]

# Attend: jump to the next agent that needs you (blocked → done → idle).
# "done" is reconstructed from state_change_seq (the API doesn't expose it).
# popup type: the script detaches the focus call so it lands after the
# popup closes (a focus request from inside a modal popup is ignored).
[[keys.command]]
key = "alt+o"
type = "popup"
command = "/home/ernie/dotfiles/utils/herdr-attend"
width = "40%"
height = 3

# Fuzzy jump: fzf over all workspaces + agents, pick one to focus.
[[keys.command]]
key = "alt+p"
type = "popup"
command = "/home/ernie/dotfiles/utils/herdr-jump"
width = "60%"
height = 20

# Whisper dictation popup, same as the tmux `D binding.
[[keys.command]]
key = "alt+d"
type = "popup"
command = "/home/ernie/dotfiles/utils/dictate -a"
width = "60%"
height = 12

# lazygit over the current workspace's repo.
[[keys.command]]
key = "alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"
