# p14s docked audio: present only the two outputs that are real.
#
#   - Acer R240HY speakers   -> HDMI4 sink on the Radeon audio controller
#   - headphones in the dock -> ThinkPad USB-C Dock Gen2 analog out
#
# Devices are re-prioritised, not disabled, so an undocked session still has
# working audio. A hardcoded default sink would strand the session on a
# missing device when undocked - that was the 2026-09-18 dead-HDMI bug (see
# apps/pulse/default.pa). The absent-while-undocked devices simply don't
# appear, so the laptop speakers win by default on their own.
#
# Note: the dock's analog output reports "availability unknown" - no jack
# detection, so that sink is listed whether or not headphones are plugged in.
# Plugging them in is what makes it audible; it cannot be made conditional.

monitor.alsa.rules = [
  # The two we want, ranked above everything else.
  {
    matches = [
      { node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI4__sink" }
    ]
    actions = {
      update-props = {
        node.description = "Monitor speakers (R240HY)"
        priority.driver  = 2000
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Lenovo_ThinkPad_USB-C_Dock.*" }
    ]
    actions = {
      update-props = {
        node.description = "Dock headphones"
        priority.driver  = 1900
        priority.session = 1900
      }
    }
  }

  # Internal laptop speakers: demoted so that while docked neither the
  # autoswitcher nor a volume-key script lands here. Undocked it is the only
  # output present, so it still wins.
  {
    matches = [
      { node.name = "alsa_output.pci-0000_c4_00.6.HiFi__Speaker__sink" }
    ]
    actions = {
      update-props = {
        priority.driver  = 150
        priority.session = 150
      }
    }
  }

  # DP/HDMI pins with nothing attached (eld_valid 0). HDMI4 is the live one
  # and is deliberately not matched here.
  {
    matches = [
      { node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI1__sink" }
      { node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI2__sink" }
      { node.name = "alsa_output.pci-0000_c4_00.1.HiFi__HDMI3__sink" }
    ]
    actions = {
      update-props = {
        node.description = "(unused DP output)"
        priority.driver  = 100
        priority.session = 100
      }
    }
  }
]
